<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1526"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="#26324f" stroke-width="2"/>

  <!-- status pill -->
  <g transform="translate(80,90)">
    <rect x="0" y="0" width="300" height="46" rx="23" fill="rgba(79,209,161,0.14)" stroke="#26324f"/>
    <circle cx="28" cy="23" r="7" fill="#4FD1A1"/>
    <text x="48" y="30" font-family="'IBM Plex Mono', monospace" font-size="19" fill="#4FD1A1">All systems operational</text>
  </g>

  <text x="80" y="270" font-family="'Space Grotesk', sans-serif" font-size="104" font-weight="700" fill="#E7ECF7">Bishnu Thapa</text>
  <text x="82" y="330" font-family="'Space Grotesk', sans-serif" font-size="40" font-weight="500" fill="#F0B45E">DevOps Engineer, Trainer and DevSecOps Consultant</text>
  <text x="82" y="392" font-family="'IBM Plex Sans', sans-serif" font-size="27" fill="#8B99B8">Eight plus years across networking, systems, security and site reliability.</text>

  <!-- service dots row -->
  <g transform="translate(82,470)" font-family="'IBM Plex Sans', sans-serif" font-size="24" fill="#8B99B8">
    <circle cx="7" cy="-8" r="7" fill="#4FD1A1"/><text x="26" y="0">Networking</text>
    <circle cx="217" cy="-8" r="7" fill="#4FD1A1"/><text x="236" y="0">Security</text>
    <circle cx="392" cy="-8" r="7" fill="#4FD1A1"/><text x="411" y="0">DevSecOps</text>
    <circle cx="612" cy="-8" r="7" fill="#4FD1A1"/><text x="631" y="0">SRE</text>
  </g>

  <text x="80" y="560" font-family="'IBM Plex Mono', monospace" font-size="24" fill="#5f6d8c">bishnuthapa.info.np</text>

  <!-- pulse mark -->
  <g transform="translate(980,470)">
    <path d="M0 20 H40 L58 -18 L82 60 L100 12 L114 20 H150"
          fill="none" stroke="#4FD1A1" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
